<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DJCreeper  Shop</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/styles.css">
<style>
  .product {
    max-width: 320px;
    margin: 0 auto;
    padding: 16px;
    background: #222;
    border-radius: 10px;
    box-shadow: 0 2px 8px #0004;
    text-align: center;
  }
  .product img {
    max-width: 220px;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .achat-step {
    margin-bottom: 15px;
  }
  .achat-step strong {
    color: #ffcc00;
  }
  .achat-container {
    background: #111;
    color: #fff;
    padding: 20px;
    border-radius: 8px;
    line-height: 1.6;
  }
  .achat-container a {
    color: #00aaff;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <div class="brand">
        <a href="index.html"><img src="assets/logo.png" alt="Logo DJCreeper"></a>
        <div class="brand-title">DJCreeper</div>
      </div>
      <button class="menu-btn" aria-label="Menu"> Menu</button>
      <nav class="navlinks">
        <a href="index.html">Accueil</a>
        <a href="wiki.html">Wiki</a>
        <a href="reglement.html">Règlement</a>
        <a href="team.html">Team Creeper</a>
        <a href="events.html">Événement</a>
        <a href="shop.html">Shop</a>
        <a href="dons.html">Don</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Shop</h1>
    <div class="alert" style="background:#ffffdd;color:#aa8800;padding:12px;border-radius:6px;margin-bottom:18px;text-align:center;">
    De nouveaux produits arrivent prochainement !
  </div>
    <div class="space-lg"></div>

    <section class="grid grid-1">
      <article class="card product">
        <div class="thumb">
          <img src="./assets/NewTeeshirt.jpeg" alt="Nouveaux produits à venir">
        </div>
        <div>
          <h3>À venir...</h3>
          <p class="muted">Restez à l'écoute pour les nouveautés !</p>
        </div>
      </article>
    </section>
  </main>

  <footer class="footer">
    <div class="container cols">
      <div>
        <strong>DJCreeper</strong>
        <small> <span id="year"></span></small>
      </div>
    </div>
  </footer>
<script src="js/script.js"></script>
<script>document.getElementById('year').textContent=new Date().getFullYear()</script>
</body>
</html>
