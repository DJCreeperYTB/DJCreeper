name = "djcreeper-shop-api"
main = "src/index.js"
compatibility_date = "2026-09-04"

# PUBLIC_ORIGIN reste volontairement inchangé jusqu’à réception du domaine
# Cloudflare Pages. ALLOW_LOCAL_DEMO doit rester désactivé en production.
[vars]
PUBLIC_ORIGIN = "https://djcreeper.pages.dev"
# Origines locales explicites du panel vendeur privé lancé par ouvrir-admin.bat.
# Cette autorisation CORS ne remplace pas Cloudflare Access sur /api/admin/*.
ADMIN_ORIGINS = "http://127.0.0.1:8090,http://localhost:8090"
ALLOW_LOCAL_DEMO = "false"

# Paramètres publics de vérification Cloudflare Access pour les routes /api/admin/*.
# À renseigner après création de l’application Access ; aucun token n’est à mettre ici.
CF_ACCESS_TEAM_DOMAIN = "https://blue-forest-bdfe.cloudflareaccess.com"
CF_ACCESS_AUDIENCE = "b0f17e1ca75d0d287336b9d4e9002bceaef2e2984231198712fce3b31a4064fb"
# EMAIL_PROVIDER = "resend"
# EMAIL_FROM = "DJCreeper <support@ton-domaine.fr>"
# EMAIL_REPLY_TO = "support@ton-domaine.fr"

[[d1_databases]]
binding = "DB"
database_name = "djcreeper-shop"
database_id = "8563e4ea-e26d-4c72-a935-2f02e4a025d9"

[[r2_buckets]]
binding = "PAYMENT_PROOFS"
bucket_name = "djcreeper-payment-proofs"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "47790d1ef4594c2ea6a713bca24fad24"
